name: Bug report
description: 打印失败、参数不生效、工具报错等
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先确认客户端在线：让模型调用 `getConnectStatus`。若它返回不在线，问题多半在客户端，不在本仓库。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望的结果 vs 实际的结果
      placeholder: 调 printHtml 打印 80mm 小票，出来的 PDF 是 A4 宽度，右边被裁掉。
    validations:
      required: true

  - type: textarea
    id: tool-call
    attributes:
      label: 工具调用参数
      description: 贴出完整的工具名和 arguments（脱敏后的 HTML 也可以）
      render: json
      placeholder: |
        {
          "tool": "printHtml",
          "arguments": { "html": "<h1>test</h1>", "dry_run": true, "paper_format": "A4" }
        }
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 返回内容 / 报错
      description: 工具返回值，或宿主里的错误日志（stderr）
      render: text
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: 版本
      description: mcp-web-print-pdf / Web打印专家客户端 / Node.js / 宿主
      placeholder: mcp-web-print-pdf 0.2.3, 客户端 1.0.9, Node 20.11, Claude Desktop 0.7
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
        - 银河麒麟 / 统信 UOS
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: 宿主
      options:
        - Claude Desktop
        - Cursor
        - Claude Code
        - VS Code + Copilot
        - DeepSeek Harness (dsh)
        - Codex CLI
        - Cline / Roo / Kilo
        - Cherry Studio
        - Trae
        - 其它
    validations:
      required: true
